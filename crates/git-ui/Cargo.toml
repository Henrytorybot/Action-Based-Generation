[package]
name = "abg-git-ui"
description = "Desktop UI to clone, pull and push the project's GitHub repository"
version.workspace = true
edition.workspace = true

[[bin]]
name = "abg-git-ui"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
# Opens URLs through the platform's handler API instead of a shell command.
webbrowser = "1.2"
